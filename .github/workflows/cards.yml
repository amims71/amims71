name: Refresh profile cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - avatar.png
      - generate.mjs
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/cards.yml

# Three trigger sources above (schedule, workflow_dispatch, push) can all
# reach the commit/push step below. Without a shared group, two overlapping
# runs would both check out the same base and race to `git push`, and the
# loser fails non-fast-forward with no retry -- silently dropping that
# day's refresh on a repo nobody is watching. cancel-in-progress is false
# on purpose: cancelling a run mid-generate would abandon a refresh
# part-way through, whereas queuing lets the second run check out fresh
# after the first has already pushed, so it naturally picks up the latest
# base instead of racing against it.
concurrency:
  group: cards-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Deliberately no `with: token:`. The bare default uses the ephemeral
      # github.token (GITHUB_TOKEN), and pushes authored by GITHUB_TOKEN do
      # not re-trigger `on: push` workflows -- that's what keeps this job
      # from retriggering itself every day. If `main` ever gets branch
      # protection that rejects this workflow's direct push, do NOT "fix"
      # it by adding `with: token: ${{ secrets.SOME_PAT }}` here: pushes
      # authored by a PAT *do* retrigger `on: push`, and card.svg/heatmap.svg
      # aren't in this workflow's own push.paths filter, so nothing else
      # would stop the resulting loop.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Generate before test, not after: test/repo-guards.test.mjs reads
      # card.svg and heatmap.svg from disk and is what enforces the C4
      # email/phone scan over the published artifacts (plus the "exactly
      # two SVGs" assertion). Generating first means the tests below run
      # against the same SVGs this job is about to commit, not yesterday's.
      #
      # GH_TOKEN is an optional repository secret. It is only needed if the
      # default GITHUB_TOKEN cannot resolve the private-inclusive contribution
      # calendar; see the spec's "Open risk" note in §7. The generator prefers
      # GH_TOKEN and falls back to GITHUB_TOKEN.
      - run: npm run generate
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm test

      - name: Commit regenerated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add card.svg heatmap.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
